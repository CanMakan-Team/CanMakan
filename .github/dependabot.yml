version: 2
updates:
  # Web (React + Vite)
  - package-ecosystem: "npm"
    directory: "/client/web"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "web"

  # Backend (Spring Boot / Maven)
  - package-ecosystem: "maven"
    directory: "/server/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"

  # Mobile (Android / Gradle)
  - package-ecosystem: "gradle"
    directory: "/client/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "mobile"

  # GitHub Actions themselves
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "ci"
