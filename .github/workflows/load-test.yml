name: Performance Load Test (k6)

on:
  workflow_dispatch:
  # schedule:
  #  - cron: '0 19 * * 0'

jobs:
  k6-load-test:
    name: Execute k6 Load Test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1

      - name: Run k6 Load Test
        uses: grafana/run-k6-action@de51a7390bdf0ac85a3bef493691bd71d4c7c158 # v1
        env:
          API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        with:
          path: '.github/scripts/k6-load-test.js'

      - name: Publish Visual Table to GitHub Summary
        if: always()
        run: |
          if [ -f github_summary.md ]; then
            cat github_summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Load test summary file not found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Load Test Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k6-results
          path: |
            results.json
            summary.json
            summary.html
            github_summary.md
          retention-days: 14
