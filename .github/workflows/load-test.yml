name: Performance Load Test (k6)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * 0'

jobs:
  k6-load-test:
    name: Execute k6 Load Test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Load Test
        uses: grafana/run-k6-action@v1
        env:
          API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        with:
          path: '.github/scripts/k6-load-test.js'

      - name: Publish Visual Table to GitHub Summary
        if: always()
        run: |
          if [ -f github_summary.md ]; then
            cat github_summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Load test summary file not found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Load Test Reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: k6-test-reports
          path: |
            results.json
            result.html
          retention-days: 14
