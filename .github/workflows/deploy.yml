name: Deploy Backend to AWS EC2

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main, develop]

concurrency:
  group: deploy-backend
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  # Promote the JAR CI already verified for this SHA (no second Maven compile).
  resolve-artifact:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      has_jar: ${{ steps.check.outputs.has_jar }}
    steps:
      - name: Check CI uploaded backend-jar
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[].name' | grep -qx backend-jar; then
            echo "has_jar=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_jar=false" >> "$GITHUB_OUTPUT"
            echo "No backend-jar artefact (CI skipped backend or upload failed)."
          fi

  # Env names mirror application.properties. Forwarded to EC2 at JAR start.
  deploy-backend:
    needs: resolve-artifact
    if: needs.resolve-artifact.outputs.has_jar == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    env:
      # Spring profile: deployed EC2 must not fall back to spring.profiles.default=dev.
      # Override per GitHub Environment (staging/production) via vars.SPRING_PROFILES_ACTIVE if needed.
      SPRING_PROFILES_ACTIVE: ${{ vars.SPRING_PROFILES_ACTIVE || 'prod' }}

      # Server
      SERVER_ADDRESS: ${{ secrets.SERVER_ADDRESS }}

      # CORS
      CANMAKAN_CORS_ALLOWED_ORIGINS: ${{ secrets.CANMAKAN_CORS_ALLOWED_ORIGINS }}
      CANMAKAN_CORS_ALLOWED_HEADERS: ${{ secrets.CANMAKAN_CORS_ALLOWED_HEADERS }}
      CANMAKAN_CORS_ALLOWED_METHODS: ${{ secrets.CANMAKAN_CORS_ALLOWED_METHODS }}
      CANMAKAN_CORS_ALLOWED_ORIGIN_PATTERNS: ${{ secrets.CANMAKAN_CORS_ALLOWED_ORIGIN_PATTERNS }}
      CANMAKAN_CORS_ALLOW_CREDENTIALS: ${{ secrets.CANMAKAN_CORS_ALLOW_CREDENTIALS }}
      CANMAKAN_CORS_MAX_AGE_SECONDS: ${{ secrets.CANMAKAN_CORS_MAX_AGE_SECONDS }}

      # UC9 invites (+ App Distribution install link shared with web)
      CANMAKAN_INVITES_PUBLIC_BASE_URL: ${{ secrets.CANMAKAN_INVITES_PUBLIC_BASE_URL }}
      FIREBASE_APP_DISTRIBUTION_URL: ${{ secrets.FIREBASE_APP_DISTRIBUTION_URL }}
      CANMAKAN_INVITES_EXPIRY_DAYS: ${{ secrets.CANMAKAN_INVITES_EXPIRY_DAYS }}

      # UC10 Resend invitation email
      CANMAKAN_EMAIL_RESEND_ENABLED: ${{ secrets.CANMAKAN_EMAIL_RESEND_ENABLED }}
      CANMAKAN_EMAIL_RESEND_API_KEY: ${{ secrets.CANMAKAN_EMAIL_RESEND_API_KEY }}
      CANMAKAN_EMAIL_RESEND_FROM: ${{ secrets.CANMAKAN_EMAIL_RESEND_FROM }}
      CANMAKAN_EMAIL_RESEND_API_URL: ${{ secrets.CANMAKAN_EMAIL_RESEND_API_URL }}

      # Datasource
      MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
      MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
      MYSQL_DB: ${{ secrets.MYSQL_DB }}
      MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}

      # UC19 JWT / refresh
      JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
      JWT_ACCESS_TTL: ${{ secrets.JWT_ACCESS_TTL }}
      JWT_SIGNING_SECRET: ${{ secrets.JWT_SIGNING_SECRET }}
      REFRESH_TOKEN_TTL: ${{ secrets.REFRESH_TOKEN_TTL }}
      REFRESH_COOKIE_NAME: ${{ secrets.REFRESH_COOKIE_NAME }}
      REFRESH_COOKIE_SECURE: ${{ secrets.REFRESH_COOKIE_SECURE }}
      REFRESH_COOKIE_SAME_SITE: ${{ vars.REFRESH_COOKIE_SAME_SITE || 'Lax' }}

      # Product APIs (OFF / EAN-Search)
      OPEN_FOOD_FACTS_BASE_URL: ${{ secrets.OPEN_FOOD_FACTS_BASE_URL }}
      EAN_SEARCH_BASE_URL: ${{ secrets.EAN_SEARCH_BASE_URL }}
      EAN_SEARCH_API_KEY: ${{ secrets.EAN_SEARCH_API_KEY }}
      PRODUCT_API_CONNECT_TIMEOUT_MS: ${{ secrets.PRODUCT_API_CONNECT_TIMEOUT_MS }}
      PRODUCT_API_RESPONSE_TIMEOUT_MS: ${{ secrets.PRODUCT_API_RESPONSE_TIMEOUT_MS }}
      PRODUCT_API_RETRY_MAX_ATTEMPTS: ${{ secrets.PRODUCT_API_RETRY_MAX_ATTEMPTS }}
      PRODUCT_API_RETRY_BACKOFF_MS: ${{ secrets.PRODUCT_API_RETRY_BACKOFF_MS }}

      # OpenAI / AI agent
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      CANMAKAN_AI_ENABLED: ${{ secrets.CANMAKAN_AI_ENABLED }}
      CANMAKAN_AI_TIMEOUT_MS: ${{ secrets.CANMAKAN_AI_TIMEOUT_MS }}
      CANMAKAN_AI_RETRY_MAX_ATTEMPTS: ${{ secrets.CANMAKAN_AI_RETRY_MAX_ATTEMPTS }}
      CANMAKAN_AI_RETRY_BACKOFF_MS: ${{ secrets.CANMAKAN_AI_RETRY_BACKOFF_MS }}
      CANMAKAN_AI_AGENT_MAX_TOOL_ITERATIONS: ${{ secrets.CANMAKAN_AI_AGENT_MAX_TOOL_ITERATIONS }}
      CANMAKAN_AI_AUDIT_ENABLED: ${{ secrets.CANMAKAN_AI_AUDIT_ENABLED }}
      CANMAKAN_AI_AUDIT_STORE_PROMPT: ${{ secrets.CANMAKAN_AI_AUDIT_STORE_PROMPT }}
      CANMAKAN_AI_AUDIT_STORE_RESPONSE: ${{ secrets.CANMAKAN_AI_AUDIT_STORE_RESPONSE }}

      # Tavily
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      TAVILY_URL: ${{ secrets.TAVILY_URL }}

      # UC5 recommendations
      CANMAKAN_RECOMMENDATION_ML_ENABLED: ${{ secrets.CANMAKAN_RECOMMENDATION_ML_ENABLED }}
      CANMAKAN_RECOMMENDATION_ML_ARTIFACT_PATH: ${{ secrets.CANMAKAN_RECOMMENDATION_ML_ARTIFACT_PATH }}
      CANMAKAN_RECOMMENDATION_LLM_ENABLED: ${{ secrets.CANMAKAN_RECOMMENDATION_LLM_ENABLED }}
    steps:
      - name: Download verified backend JAR
        uses: actions/download-artifact@v4.3.0
        with:
          name: backend-jar
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          path: server/backend/target

      # 2.3 PREPARE REMOTE DEPLOY DIRECTORY
      - name: Ensure remote deploy directory exists
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p /home/ubuntu/app/deploy-temp

      # 2.4 COPY .JAR PACKAGE TO EC2 VIA SCP
      - name: Copy JAR to EC2 via SCP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "server/backend/target/*.jar"
          target: "/home/ubuntu/app/deploy-temp"
          strip_components: 3

      # 2.5 START REMOTE SSH CLI
      - name: Execute Remote SSH Startup Commands
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: SPRING_PROFILES_ACTIVE,SERVER_ADDRESS,CANMAKAN_CORS_ALLOWED_ORIGINS,CANMAKAN_CORS_ALLOWED_HEADERS,CANMAKAN_CORS_ALLOWED_METHODS,CANMAKAN_CORS_ALLOWED_ORIGIN_PATTERNS,CANMAKAN_CORS_ALLOW_CREDENTIALS,CANMAKAN_CORS_MAX_AGE_SECONDS,CANMAKAN_INVITES_PUBLIC_BASE_URL,FIREBASE_APP_DISTRIBUTION_URL,CANMAKAN_INVITES_EXPIRY_DAYS,CANMAKAN_EMAIL_RESEND_ENABLED,CANMAKAN_EMAIL_RESEND_API_KEY,CANMAKAN_EMAIL_RESEND_FROM,CANMAKAN_EMAIL_RESEND_API_URL,MYSQL_HOST,MYSQL_PORT,MYSQL_DB,MYSQL_USERNAME,MYSQL_PASSWORD,JWT_ISSUER,JWT_ACCESS_TTL,JWT_SIGNING_SECRET,REFRESH_TOKEN_TTL,REFRESH_COOKIE_NAME,REFRESH_COOKIE_SECURE,REFRESH_COOKIE_SAME_SITE,OPEN_FOOD_FACTS_BASE_URL,EAN_SEARCH_BASE_URL,EAN_SEARCH_API_KEY,PRODUCT_API_CONNECT_TIMEOUT_MS,PRODUCT_API_RESPONSE_TIMEOUT_MS,PRODUCT_API_RETRY_MAX_ATTEMPTS,PRODUCT_API_RETRY_BACKOFF_MS,OPENAI_BASE_URL,OPENAI_API_KEY,OPENAI_MODEL,CANMAKAN_AI_ENABLED,CANMAKAN_AI_TIMEOUT_MS,CANMAKAN_AI_RETRY_MAX_ATTEMPTS,CANMAKAN_AI_RETRY_BACKOFF_MS,CANMAKAN_AI_AGENT_MAX_TOOL_ITERATIONS,CANMAKAN_AI_AUDIT_ENABLED,CANMAKAN_AI_AUDIT_STORE_PROMPT,CANMAKAN_AI_AUDIT_STORE_RESPONSE,TAVILY_API_KEY,TAVILY_URL,CANMAKAN_RECOMMENDATION_ML_ENABLED,CANMAKAN_RECOMMENDATION_ML_ARTIFACT_PATH,CANMAKAN_RECOMMENDATION_LLM_ENABLED
          script: |
            sudo apt-get update > /dev/null && sudo apt-get install -y lsof > /dev/null
            # Ensure runtime destination directory exists
            mkdir -p /home/ubuntu/app

            # Provision logrotate configuration if missing
            if [ ! -f /etc/logrotate.d/canmakan-backend ]; then
              echo "Provisioning logrotate profile..."
              echo "/home/ubuntu/app/output-*.log {
                  daily
                  rotate 7
                  size 50M
                  compress
                  delaycompress
                  missingok
                  notifempty
                  copytruncate
              }" | sudo tee /etc/logrotate.d/canmakan-backend > /dev/null
              sudo chmod 644 /etc/logrotate.d/canmakan-backend
            fi

            # Determine active port and set the new port
            ACTIVE_PORT=$(cat /home/ubuntu/app/active_port.txt 2>/dev/null || echo "8081")
            if [ "$ACTIVE_PORT" = "8080" ]; then
              NEW_PORT="8081"
            else
              NEW_PORT="8080"
            fi
            echo "Deploying new instance to port $NEW_PORT (SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-unset})..."

            # Move new artefact into place
            JAR_PATH="$(ls -t /home/ubuntu/app/deploy-temp/*.jar | grep -v '\.original$' | head -n 1)"
            if [ -z "$JAR_PATH" ]; then echo "ERROR: No deployable JAR found"; exit 1; fi
            mv "$JAR_PATH" /home/ubuntu/app/canmakan-backend-$NEW_PORT.jar

            # Start the new application. Prefer the profile forwarded from GitHub Actions
            # over any SPRING_PROFILES_ACTIVE in /etc/environment.
            DEPLOY_SPRING_PROFILES_ACTIVE="${SPRING_PROFILES_ACTIVE:-prod}"
            export SPRING_PROFILES_ACTIVE="$DEPLOY_SPRING_PROFILES_ACTIVE"
            
            # Kill any orphaned processes on the target port before starting
            ORPHAN_PID=$(lsof -t -i:$NEW_PORT || true)
            if [ -n "$ORPHAN_PID" ]; then
              echo "Killing orphaned process on port $NEW_PORT..."
              kill -9 $ORPHAN_PID || true
              sleep 2
            fi
            nohup java -jar /home/ubuntu/app/canmakan-backend-$NEW_PORT.jar --server.port=$NEW_PORT > /home/ubuntu/app/output-$NEW_PORT.log 2>&1 &
            NEW_PID=$!

            # Wait for the new application to become healthy
            echo "Polling health check on port $NEW_PORT..."
            TIMEOUT=60
            while [ $TIMEOUT -gt 0 ]; do
              if curl -s "http://localhost:$NEW_PORT/actuator/health" | grep '"status":"UP"' > /dev/null; then
                echo "Instance is UP."
                break
              fi
              sleep 5
              TIMEOUT=$((TIMEOUT-5))
            done

            if [ $TIMEOUT -le 0 ]; then
              echo "ERROR: Instance failed health check. Rolling back."
              kill -9 $NEW_PID
              exit 1
            fi
            
            # Swap Nginx routing configuration
            echo "Swapping Nginx to port $NEW_PORT..."
            echo "upstream backend_pool { server 127.0.0.1:$NEW_PORT; }" | sudo tee /etc/nginx/conf.d/canmakan-upstream.conf
            sudo systemctl reload nginx

            # Gracefully terminate the old application
            OLD_PID=$(lsof -t -i:$ACTIVE_PORT || true)
            if [ -n "$OLD_PID" ]; then
              kill -15 $OLD_PID || true
            fi

            # Save the new system state
            echo $NEW_PORT > /home/ubuntu/app/active_port.txt

            # Clean up old JAR files from previous inactive deployments
            echo "Cleaning up inactive JAR files..."
            find /home/ubuntu/app -maxdepth 1 -name "canmakan-backend-*.jar" ! -name "canmakan-backend-$NEW_PORT.jar" -delete
            rm -rf /home/ubuntu/app/deploy-temp/*
