name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
      MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
      MYSQL_DB: ${{ secrets.MYSQL_DB }}
      MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_URL: ${{ secrets.MYSQL_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      EAN_SEARCH_API_KEY: ${{ secrets.EAN_SEARCH_API_KEY }}
      SERVER_ADDRESS: ${{ secrets.SERVER_ADDRESS }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Maven
        working-directory: server/backend
        run: mvn -B clean package -DskipTests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/web/package-lock.json

      - name: Install web dependencies
        working-directory: client/web
        run: npm ci

      - name: Build web app
        working-directory: client/web
        run: npm run build

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > client/mobile/local.properties

      - name: Build mobile app
        working-directory: client/mobile
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug