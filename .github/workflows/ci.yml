name: CI

on:
  workflow_dispatch:
    inputs:
      force_backend:
        description: Rebuild and push canmakan-backend even if path filters would skip it
        type: boolean
        default: true
      force_ml:
        description: Rebuild and push canmakan-ml even if path filters would skip it
        type: boolean
        default: false
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. ANALYZE CHANGES IN MOBILE, WEB & BACKEND
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.resolved.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      machine-learning: ${{ steps.resolved.outputs.machine-learning }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Detect File Changes
        uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            backend:
              - 'server/backend/**'
            web:
              - 'client/web/**'
              - 'client/shared/**'
            mobile:
              - 'client/mobile/**'
              - 'client/shared/**'
            machine-learning:
              - 'server/machine-learning/**'
              - 'server/backend/src/main/resources/01_products.sql'

      - name: Resolve stack builds
        id: resolved
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_BACKEND: ${{ github.event.inputs.force_backend }}
          FORCE_ML: ${{ github.event.inputs.force_ml }}
          FILTER_BACKEND: ${{ steps.filter.outputs.backend }}
          FILTER_ML: ${{ steps.filter.outputs.machine-learning }}
        run: |
          backend="${FILTER_BACKEND}"
          ml="${FILTER_ML}"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${FORCE_BACKEND}" = "true" ]; then
              backend=true
            fi
            if [ "${FORCE_ML}" = "true" ]; then
              ml=true
            fi
          fi
          echo "backend=${backend}" >> "$GITHUB_OUTPUT"
          echo "machine-learning=${ml}" >> "$GITHUB_OUTPUT"

  # Path filters skip image Trivy jobs. develop still has Code Scanning
  # categories trivy-image and trivy-ml-image. Without a SARIF upload on the
  # PR, GitHub cannot compute "alerts introduced by this pull request".
  code-scanning-skipped-image-sarif:
    name: Code Scanning image placeholders
    needs: detect-changes
    if: >
      github.event_name == 'pull_request' &&
      (needs.detect-changes.outputs.backend != 'true' ||
       needs.detect-changes.outputs.machine-learning != 'true')
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Write empty Trivy SARIF
        run: |
          cat > empty-trivy.sarif <<'EOF'
          {
            "version": "2.1.0",
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "Trivy",
                    "informationUri": "https://github.com/aquasecurity/trivy"
                  }
                },
                "results": []
              }
            ]
          }
          EOF

      - name: Upload placeholder backend image SARIF
        if: needs.detect-changes.outputs.backend != 'true'
        uses: github/codeql-action/upload-sarif@v4.37.7
        with:
          sarif_file: empty-trivy.sarif
          category: trivy-image

      - name: Upload placeholder ML image SARIF
        if: needs.detect-changes.outputs.machine-learning != 'true'
        uses: github/codeql-action/upload-sarif@v4.37.7
        with:
          sarif_file: empty-trivy.sarif
          category: trivy-ml-image

  # 2. SECRET SCANNING
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        run: gitleaks detect --source . --verbose --config .gitleaks.toml

  # 3. SAST
  sast-scan:
    name: Static Code Analysis (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Run Semgrep
        run: |
          docker run --rm -v "$(pwd):/src" semgrep/semgrep:1.173.0 semgrep --config p/default

  # 4. SCA (dependencies / lockfiles)
  sca-scan:
    name: Software Composition Analysis (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: vuln
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Write Trivy filesystem SARIF
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: vuln
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy filesystem SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.7
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

      - name: Write CycloneDX SBOM
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: vuln
          format: 'cyclonedx'
          output: 'trivy-sbom.cdx.json'
          exit-code: '0'

      - name: Upload CycloneDX SBOM
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: trivy-sbom
          path: trivy-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  # 5. GITHUB ACTIONS YAML / CONFIG MISCONFIGURATION
  config-scan:
    name: Workflow Config Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Run Trivy config scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.github'
          format: 'sarif'
          output: 'trivy-config-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy config SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.7
        with:
          sarif_file: trivy-config-results.sarif
          category: trivy-config

  # 6. BACKEND VERIFICATION
  # Tests use a job-local MySQL service, not production RDS secrets.
  # Remaining env names mirror application.properties for Spring context tests.
  build-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      security-events: write
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: canmakan
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      # Server
      SERVER_ADDRESS: ${{ secrets.SERVER_ADDRESS }}

      # CORS
      CANMAKAN_CORS_ALLOWED_ORIGINS: ${{ secrets.CANMAKAN_CORS_ALLOWED_ORIGINS }}
      CANMAKAN_CORS_ALLOWED_HEADERS: ${{ secrets.CANMAKAN_CORS_ALLOWED_HEADERS }}
      CANMAKAN_CORS_ALLOWED_METHODS: ${{ secrets.CANMAKAN_CORS_ALLOWED_METHODS }}
      CANMAKAN_CORS_ALLOWED_ORIGIN_PATTERNS: ${{ secrets.CANMAKAN_CORS_ALLOWED_ORIGIN_PATTERNS }}
      CANMAKAN_CORS_ALLOW_CREDENTIALS: ${{ secrets.CANMAKAN_CORS_ALLOW_CREDENTIALS }}
      CANMAKAN_CORS_MAX_AGE_SECONDS: ${{ secrets.CANMAKAN_CORS_MAX_AGE_SECONDS }}

      # UC9 invites
      CANMAKAN_INVITES_PUBLIC_BASE_URL: ${{ secrets.CANMAKAN_INVITES_PUBLIC_BASE_URL }}
      FIREBASE_APP_DISTRIBUTION_URL: ${{ secrets.FIREBASE_APP_DISTRIBUTION_URL }}
      CANMAKAN_INVITES_EXPIRY_DAYS: ${{ secrets.CANMAKAN_INVITES_EXPIRY_DAYS }}

      # UC10 Resend invitation email
      CANMAKAN_EMAIL_RESEND_ENABLED: ${{ secrets.CANMAKAN_EMAIL_RESEND_ENABLED }}
      CANMAKAN_EMAIL_RESEND_API_KEY: ${{ secrets.CANMAKAN_EMAIL_RESEND_API_KEY }}
      CANMAKAN_EMAIL_RESEND_FROM: ${{ secrets.CANMAKAN_EMAIL_RESEND_FROM }}
      CANMAKAN_EMAIL_RESEND_API_URL: ${{ secrets.CANMAKAN_EMAIL_RESEND_API_URL }}

      # UC19 JWT / refresh
      JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
      JWT_ACCESS_TTL: ${{ secrets.JWT_ACCESS_TTL }}
      JWT_SIGNING_SECRET: ${{ secrets.JWT_SIGNING_SECRET }}
      REFRESH_TOKEN_TTL: ${{ secrets.REFRESH_TOKEN_TTL }}
      REFRESH_COOKIE_NAME: ${{ secrets.REFRESH_COOKIE_NAME }}
      REFRESH_COOKIE_SECURE: ${{ secrets.REFRESH_COOKIE_SECURE }}
      REFRESH_COOKIE_SAME_SITE: ${{ vars.REFRESH_COOKIE_SAME_SITE || 'Lax' }}

      # Product APIs (OFF / EAN-Search)
      OPEN_FOOD_FACTS_BASE_URL: ${{ secrets.OPEN_FOOD_FACTS_BASE_URL }}
      EAN_SEARCH_BASE_URL: ${{ secrets.EAN_SEARCH_BASE_URL }}
      EAN_SEARCH_API_KEY: ${{ secrets.EAN_SEARCH_API_KEY }}
      PRODUCT_API_CONNECT_TIMEOUT_MS: ${{ secrets.PRODUCT_API_CONNECT_TIMEOUT_MS }}
      PRODUCT_API_RESPONSE_TIMEOUT_MS: ${{ secrets.PRODUCT_API_RESPONSE_TIMEOUT_MS }}
      PRODUCT_API_RETRY_MAX_ATTEMPTS: ${{ secrets.PRODUCT_API_RETRY_MAX_ATTEMPTS }}
      PRODUCT_API_RETRY_BACKOFF_MS: ${{ secrets.PRODUCT_API_RETRY_BACKOFF_MS }}

      # OpenAI / AI agent
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      CANMAKAN_AI_ENABLED: ${{ secrets.CANMAKAN_AI_ENABLED }}
      CANMAKAN_AI_TIMEOUT_MS: ${{ secrets.CANMAKAN_AI_TIMEOUT_MS }}
      CANMAKAN_AI_RETRY_MAX_ATTEMPTS: ${{ secrets.CANMAKAN_AI_RETRY_MAX_ATTEMPTS }}
      CANMAKAN_AI_RETRY_BACKOFF_MS: ${{ secrets.CANMAKAN_AI_RETRY_BACKOFF_MS }}
      CANMAKAN_AI_AGENT_MAX_TOOL_ITERATIONS: ${{ secrets.CANMAKAN_AI_AGENT_MAX_TOOL_ITERATIONS }}
      CANMAKAN_AI_AUDIT_ENABLED: ${{ secrets.CANMAKAN_AI_AUDIT_ENABLED }}
      CANMAKAN_AI_AUDIT_STORE_PROMPT: ${{ secrets.CANMAKAN_AI_AUDIT_STORE_PROMPT }}
      CANMAKAN_AI_AUDIT_STORE_RESPONSE: ${{ secrets.CANMAKAN_AI_AUDIT_STORE_RESPONSE }}

      # Tavily
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      TAVILY_URL: ${{ secrets.TAVILY_URL }}

      # UC5 recommendations
      CANMAKAN_RECOMMENDATION_ML_ENABLED: ${{ secrets.CANMAKAN_RECOMMENDATION_ML_ENABLED }}
      CANMAKAN_RECOMMENDATION_ML_ARTIFACT_PATH: ${{ secrets.CANMAKAN_RECOMMENDATION_ML_ARTIFACT_PATH }}
      CANMAKAN_RECOMMENDATION_LLM_ENABLED: ${{ secrets.CANMAKAN_RECOMMENDATION_LLM_ENABLED }}

      # Mapped here so steps can skip Sonar when unset. `secrets` is not allowed in `if:`.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Cache SonarQube packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Test and package with Maven
        working-directory: server/backend
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DB: canmakan
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: root
          JWT_SIGNING_SECRET: dGVzdC1vbmx5LXNpZ25pbmcta2V5LTMyLWJ5dGVzISE=
          CANMAKAN_AI_ENABLED: "false"
          CANMAKAN_RECOMMENDATION_LLM_ENABLED: "false"
          TAVILY_API_KEY: local-dev-placeholder
          CANMAKAN_EMAIL_RESEND_ENABLED: "false"
        run: mvn -B clean verify

      - name: SonarCloud backend
        if: env.SONAR_TOKEN != ''
        working-directory: server/backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.2.0.4988:sonar \
            -Dsonar.organization=canmakan-team \
            -Dsonar.projectKey=canmakan-backend \
            -Dsonar.projectName=canmakan-backend \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.qualitygate.wait=true

      # Flatten the boot JAR so the image build copies exactly one file.
      - name: Stage verified JAR
        run: |
          mkdir -p staged-backend-jar
          for jar in server/backend/target/*.jar; do
            [ -f "$jar" ] || continue
            case "$jar" in
              *.jar.original) continue ;;
            esac
            cp "$jar" staged-backend-jar/
          done
          count=$(find staged-backend-jar -maxdepth 1 -name '*.jar' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one deployable JAR, found $count"
            ls -la server/backend/target staged-backend-jar || true
            exit 1
          fi
          ls -la staged-backend-jar

      - name: Build backend image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/canmakan-backend"
          tag="${{ github.sha }}"
          mkdir -p image-context
          cp staged-backend-jar/*.jar image-context/app.jar
          cp server/backend/Dockerfile image-context/Dockerfile
          docker build -t "${image}:${tag}" image-context
          echo "BACKEND_IMAGE=${image}:${tag}" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE_REPO=${image}" >> "$GITHUB_ENV"

      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ env.BACKEND_IMAGE }}
          scanners: vuln
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Write backend image SARIF
        if: always() && env.BACKEND_IMAGE != ''
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ env.BACKEND_IMAGE }}
          scanners: vuln
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload backend image SARIF
        if: always() && env.BACKEND_IMAGE != ''
        uses: github/codeql-action/upload-sarif@v4.37.7
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      - name: Push backend image to GHCR
        if: >
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${BACKEND_IMAGE}"
          docker tag "${BACKEND_IMAGE}" "${BACKEND_IMAGE_REPO}:${GITHUB_REF_NAME}"
          docker push "${BACKEND_IMAGE_REPO}:${GITHUB_REF_NAME}"

      - name: Upload verified backend JAR
        uses: actions/upload-artifact@v7.0.1
        with:
          name: backend-jar
          path: staged-backend-jar/*.jar
          if-no-files-found: error
          retention-days: 14

  # 7. MACHINE LEARNING VERIFICATION
  build-machine-learning:
    needs: detect-changes
    if: needs.detect-changes.outputs.machine-learning == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: server/machine-learning/requirements.txt

      - name: Install dependencies and run pytest
        working-directory: server/machine-learning
        run: |
          pip install -r requirements.txt
          pytest --cov=canmakan_ml --cov-report=xml --cov-fail-under=80

      - name: SonarCloud machine learning
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectBaseDir: server/machine-learning
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.qualitygate.wait=true

      - name: Train ranker artifact
        working-directory: server/machine-learning
        run: |
          python scripts/export_products.py
          python scripts/train_ranker.py
          test -f artifacts/tfidf_ranker.joblib

      - name: Build ML image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/canmakan-ml"
          tag="${{ github.sha }}"
          docker build -t "${image}:${tag}" server/machine-learning
          echo "ML_IMAGE=${image}:${tag}" >> "$GITHUB_ENV"
          echo "ML_IMAGE_REPO=${image}" >> "$GITHUB_ENV"

      - name: Scan ML image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ env.ML_IMAGE }}
          scanners: vuln
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Write ML image SARIF
        if: always() && env.ML_IMAGE != ''
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ env.ML_IMAGE }}
          scanners: vuln
          format: 'sarif'
          output: 'trivy-ml-image-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload ML image SARIF
        if: always() && env.ML_IMAGE != ''
        uses: github/codeql-action/upload-sarif@v4.37.7
        with:
          sarif_file: trivy-ml-image-results.sarif
          category: trivy-ml-image

      - name: Push ML image to GHCR
        if: >
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${ML_IMAGE}"
          docker tag "${ML_IMAGE}" "${ML_IMAGE_REPO}:${GITHUB_REF_NAME}"
          docker push "${ML_IMAGE_REPO}:${GITHUB_REF_NAME}"

      - name: Write ML image marker
        run: |
          mkdir -p ml-image-marker
          echo "${ML_IMAGE}" > ml-image-marker/image-uri.txt

      - name: Upload ML image marker
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ml-image
          path: ml-image-marker/image-uri.txt
          if-no-files-found: error
          retention-days: 14

  # 8. WEB VERIFICATION
  build-web:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      VITE_USE_MOCK_API: ${{ secrets.VITE_USE_MOCK_API }}
      VITE_FIREBASE_APP_DISTRIBUTION_URL: ${{ secrets.FIREBASE_APP_DISTRIBUTION_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: client/web/package-lock.json

      - name: Install web dependencies
        working-directory: client/web
        run: npm ci

      - name: Run web unit tests
        working-directory: client/web
        run: npm test -- --coverage

      - name: SonarCloud web
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectBaseDir: client/web
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.qualitygate.wait=true

      - name: Build web app
        working-directory: client/web
        run: npm run build

  # 9. MOBILE VERIFICATION
  build-mobile:
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    env:
      # Optional override for debug assemble; defaults to emulator localhost in Gradle.
      BASE_URL: ${{ secrets.MOBILE_BASE_URL }}
      # Same secret as backend invite minting (CSV aliases OK for App Links).
      CANMAKAN_INVITES_PUBLIC_BASE_URL: ${{ secrets.CANMAKAN_INVITES_PUBLIC_BASE_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Configure Android SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > client/mobile/local.properties

      - name: Configure local properties overrides
        run: |
          if [ -n "${{ env.BASE_URL }}" ]; then
            echo "BASE_URL=${{ env.BASE_URL }}" >> client/mobile/local.properties
          fi
          if [ -n "${{ env.CANMAKAN_INVITES_PUBLIC_BASE_URL }}" ]; then
            echo "CANMAKAN_INVITES_PUBLIC_BASE_URL=${{ env.CANMAKAN_INVITES_PUBLIC_BASE_URL }}" >> client/mobile/local.properties
          fi

      - name: Build, unit-test, and coverage
        working-directory: client/mobile
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest createDebugUnitTestCoverageReport lintDebug

      # AGP 9 writes coverage XML under app/build; copy to the path Sonar is configured to read.
      - name: Stage JaCoCo XML for SonarCloud
        working-directory: client/mobile
        run: |
          REPORT="$(find app/build -type f \( -name 'report.xml' -o -name 'jacoco*.xml' \) | head -n 1)"
          if [ -z "$REPORT" ]; then
            echo "No JaCoCo XML found under app/build"
            find app/build -type f -name '*.xml' | head -n 80 || true
            exit 1
          fi
          mkdir -p app/build/sonar-coverage
          cp "$REPORT" app/build/sonar-coverage/jacoco.xml
          echo "Staged coverage report from $REPORT"
          ls -la app/build/sonar-coverage/jacoco.xml

      - name: SonarCloud mobile
        if: env.SONAR_TOKEN != ''
        working-directory: client/mobile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew sonar \
            -Dsonar.gradle.skipCompile=true \
            -Dsonar.qualitygate.wait=true

  # 10. AGGREGATED STATUS GATE FOR BRANCH PROTECTION
  Build-Test:
    name: Build Test
    runs-on: ubuntu-latest
    needs: [detect-changes, gitleaks, sast-scan, sca-scan, config-scan, build-backend, build-machine-learning, build-web, build-mobile]
    if: always()
    steps:
      - name: Evaluate sub-job results
        run: |
          GITLEAKS_RESULT="${{ needs.gitleaks.result }}"
          SAST_RESULT="${{ needs.sast-scan.result }}"
          SCA_RESULT="${{ needs.sca-scan.result }}"
          CONFIG_RESULT="${{ needs.config-scan.result }}"
          BACKEND_RESULT="${{ needs.build-backend.result }}"
          MACHINE_LEARNING_RESULT="${{ needs.build-machine-learning.result }}"
          WEB_RESULT="${{ needs.build-web.result }}"
          MOBILE_RESULT="${{ needs.build-mobile.result }}"

          echo "=== Job Evaluation Details ==="
          echo "Gitleaks Secret Scan:   $GITLEAKS_RESULT"
          echo "SAST Security Analysis: $SAST_RESULT"
          echo "SCA Dependency Scan:    $SCA_RESULT"
          echo "Workflow Config Scan:   $CONFIG_RESULT"
          echo "Backend Monorepo Stack: $BACKEND_RESULT"
          echo "Machine Learning Stack: $MACHINE_LEARNING_RESULT"
          echo "Web Frontend Stack:    $WEB_RESULT"
          echo "Mobile Android Stack:   $MOBILE_RESULT"
          echo "=============================="

          FAILED=0

          # Security scans always run and must pass.
          require_success() {
            local label="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "FAIL: $label (expected success, got $result)"
              FAILED=1
            fi
          }

          # Path-filtered stack jobs may be skipped (no path changes) or cancelled
          # when concurrency cancels an older run after a newer push on the same branch.
          require_success_or_skipped() {
            local label="$1"
            local result="$2"
            case "$result" in
              success)
                echo "OK: $label passed"
                ;;
              skipped|cancelled)
                echo "OK: $label $result (no matching path changes or superseded by a newer run)"
                ;;
              *)
                echo "FAIL: $label (expected success, skipped, or cancelled, got $result)"
                FAILED=1
                ;;
            esac
          }

          require_success "Gitleaks Secret Scan" "$GITLEAKS_RESULT"
          require_success "SAST Security Analysis" "$SAST_RESULT"
          require_success "SCA Dependency Scan" "$SCA_RESULT"
          require_success "Workflow Config Scan" "$CONFIG_RESULT"
          require_success_or_skipped "Backend Monorepo Stack" "$BACKEND_RESULT"
          require_success_or_skipped "Machine Learning Stack" "$MACHINE_LEARNING_RESULT"
          require_success_or_skipped "Web Frontend Stack" "$WEB_RESULT"
          require_success_or_skipped "Mobile Android Stack" "$MOBILE_RESULT"

          if [[ "$FAILED" -ne 0 ]]; then
            echo "One or more required CI jobs failed or were cancelled."
            exit 1
          fi

          echo "All executed sub-modules passed, skipped safely, or were superseded by a newer run."
