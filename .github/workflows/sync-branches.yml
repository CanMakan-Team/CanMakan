name: Sync Main to Develop

on:
  push:
    branches:
      - main

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 

      - name: Create Pull Request to Develop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use the built-in GitHub CLI to open a PR
          gh pr create \
            --base develop \
            --head main \
            --title "🔄 Auto-Sync: Main to Develop" \
            --body "Automated PR to Sync Hotfixes and Release Changes from \`main\` back into \`develop\`. Please Review and Merge." \
            || echo "No Changes to Sync or PR Already Exists."
