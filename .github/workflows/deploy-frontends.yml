name: Deploy Frontends to Firebase

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'client/web/**'
      - 'client/mobile/**'
      - 'client/shared/**'
      - '.github/workflows/deploy-frontends.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  detect-frontend-changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect File Changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            web:
              - 'client/web/**'
              - 'client/shared/**'
            mobile:
              - 'client/mobile/**'
              - 'client/shared/**'

  e2e:
    name: Playwright E2E
    needs: detect-frontend-changes
    if: needs.detect-frontend-changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/web
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            client/web
            client/shared
            client/mobile/app/src/main/res/mipmap-xxxhdpi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: client/web/package-lock.json

      - name: Install Web Dependencies
        run: npm ci

      - name: Get Playwright Version
        id: playwright-version
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Run Playwright E2E tests
        run: npx playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-deploy
          path: client/web/playwright-report/
          retention-days: 30
          if-no-files-found: warn

  deploy-web:
    needs: [detect-frontend-changes, e2e]
    if: needs.detect-frontend-changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    concurrency:
      group: deploy-web-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: client/web
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: client/web/package-lock.json

      - name: Install Web Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_USE_MOCK_API: 'false'
          VITE_NGROK_SKIP_BROWSER_WARNING: 'true'
          VITE_FIREBASE_APP_DISTRIBUTION_URL: ${{ secrets.FIREBASE_APP_DISTRIBUTION_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          VITE_APP_VERSION: 1.0.${{ github.run_number }}-${{ github.ref == 'refs/heads/main' && 'PROD' || 'STG' }}
          VITE_APP_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

      - name: Inject API URL into Firebase Config
        working-directory: ./client/web
        run: |
          # 1. Strip any existing protocol prefixes (http:// or https://)
          RAW_URL="${{ secrets.VITE_API_BASE_URL }}"
          CLEAN_URL=$(echo "$RAW_URL" | sed -E 's|^https?://||')

          # 2. Inject clean HTTPS URL into template
          sed "s|{{ env.VITE_API_BASE_URL }}|https://${CLEAN_URL}|g" firebase.template.json > firebase.json
      
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_CREDENTIALS_JSON }}'
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          entryPoint: client/web

  deploy-mobile:
    needs: detect-frontend-changes
    if: needs.detect-frontend-changes.outputs.mobile == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    concurrency:
      group: deploy-mobile-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: client/mobile
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Decode Android Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/canmakan-release.keystore

      - name: Build Release APK
        env:
          KEYSTORE_FILE: canmakan-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MOBILE_BASE_URL: ${{ secrets.MOBILE_BASE_URL }}
        run: |
          ./gradlew assembleRelease \
            -PBASE_URL="$MOBILE_BASE_URL" \
            -PversionCode=${{ github.run_number }} \
            -PversionName="1.0.${{ github.run_number }}-${{ github.ref == 'refs/heads/main' && 'PROD' || 'STG' }}"

      - name: Shred Decoded Keystore
        if: always()
        run: rm -f app/canmakan-release.keystore

      - name: Resolve Release APK Path
        id: apk
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No release APK found under app/build/outputs/apk/release"
            find app/build/outputs -type f -name '*.apk' || true
            exit 1
          fi
          echo "path=client/mobile/${APK}" >> "$GITHUB_OUTPUT"
          echo "Using APK: client/mobile/${APK}"

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6 # v1.7.1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          groups: qa-team
          file: ${{ steps.apk.outputs.path }}
          releaseNotes: "[${{ github.ref == 'refs/heads/main' && 'PRODUCTION' || 'STAGING' }}] Automated Build v1.0.${{ github.run_number }} generated from GitHub Commit ${{ github.sha }}."
