name: Deploy Frontends to Firebase

on:
  workflow_run:
    workflows: ["E2E Playwright Tests"]
    branches: [main]
    types:
      - completed

concurrency:
  group: deploy-frontends-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # 1. PATH DETECTION
  detect-frontend-changes:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Detect File Changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event.workflow_run.head_sha }}~1
          ref: ${{ github.event.workflow_run.head_sha }}
          filters: |
            web:
              - 'client/web/**'
            mobile:
              - 'client/mobile/**'

  # 2. WEB FRONTEND (REACT / VITE -> FIREBASE HOSTING)
  deploy-web:
    needs: detect-frontend-changes
    if: needs.detect-frontend-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/web
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: client/web/package-lock.json

      - name: Install Web Dependencies
        run: npm ci

      # Inject Variables/Secrets into Vite's Build Process to Replace Placeholders
      # Inject Versioning
      - name: Build Web Application
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_USE_MOCK_API: 'false'
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          VITE_APP_VERSION: 1.0.${{ github.event.workflow_run.run_number }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_CREDENTIALS_JSON }}'
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          entryPoint: client/web

  # 3. MOBILE FRONTEND (ANDROID KOTLIN -> FIREBASE APP DISTRIBUTION)
  deploy-mobile:
    needs: detect-frontend-changes
    if: needs.detect-frontend-changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/mobile
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set Up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      # Decode the Base64 string back into a physical file on the runner
      - name: Decode Android Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/canmakan-release.keystore
      
      # Pass Signing Secrets as Environment Variables to the Build Process
      - name: Build Release APK
        env:
          KEYSTORE_FILE: canmakan-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MOBILE_BASE_URL: ${{ secrets.MOBILE_BASE_URL }}
        run: |
          ./gradlew assembleRelease \
            -PBASE_URL="$MOBILE_BASE_URL" \
            -PversionCode=${{ github.event.workflow_run.run_number }} \
            -PversionName="1.0.${{ github.event.workflow_run.run_number }}"

      # Destruction of Decoded Keystore
      - name: Shred Decoded Keystore
        if: always()
        run: rm -f app/canmakan-release.keystore
      
      # Resolve the Signed Path
      - name: Resolve Release APK Path
        id: apk
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No release APK found under app/build/outputs/apk/release"
            find app/build/outputs -type f -name '*.apk' || true
            exit 1
          fi
          echo "path=client/mobile/${APK}" >> "$GITHUB_OUTPUT"
          echo "Using APK: client/mobile/${APK}"

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          groups: qa-team
          file: ${{ steps.apk.outputs.path }}
          releaseNotes: "Automated Build v1.0.${{ github.event.workflow_run.run_number }} generated from GitHub Commit ${{ github.event.workflow_run.head_sha }}."
