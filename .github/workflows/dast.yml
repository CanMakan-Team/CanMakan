name: DAST (OWASP ZAP)

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 2:00 AM SGT (18:00 UTC)
    - cron: '0 18 * * *'

permissions:
  issues: write
  contents: read

jobs:
  zap-web-scan:
    name: ZAP Scan - Web Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Run ZAP Baseline Scan (Web)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://canmakan-staging.web.app'
          issue_title: 'DAST Vulnerability Report - Web Staging'
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_action: false

      - name: Upload Web Scan Reports
        uses: actions/upload-artifact@v4.3.1
        if: always()
        with:
          name: zap-web-reports
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 30

  zap-api-scan:
    name: ZAP Scan - Backend API
    runs-on: ubuntu-latest
    environment: staging 
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Run ZAP API Scan (Backend)
        uses: zaproxy/action-api-scan@v0.8.0
        with:
          format: openapi
          # Ensure this URL matches your actual OpenAPI/Swagger JSON endpoint
          target: 'https://api.staging.canmakan.space/v3/api-docs'
          issue_title: 'DAST Vulnerability Report - API Staging'
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_action: false
          cmd_options: >-
            -config replacer.full_list(0).description="JWT Auth"
            -config replacer.full_list(0).enabled=true
            -config replacer.full_list(0).matchtype=req_header
            -config replacer.full_list(0).matchstr="Authorization"
            -config replacer.full_list(0).regex=false
            -config replacer.full_list(0).replacement="Bearer ${{ secrets.DAST_TEST_JWT }}"

      - name: Upload API Scan Reports
        uses: actions/upload-artifact@v4.3.1
        if: always()
        with:
          name: zap-api-reports
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 30
