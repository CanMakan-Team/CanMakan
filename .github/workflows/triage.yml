name: Issue Triage

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  auto-label:
    runs-on: ubuntu-latest
    steps:
      - name: Label based on keywords
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const body = context.payload.issue.body.toLowerCase();
            const labels = [];
            
            if (body.includes('bug') || body.includes('crash')) labels.push('bug');
            if (body.includes('feature') || body.includes('add')) labels.push('enhancement');
            if (body.includes('security') || body.includes('cve')) labels.push('security');
            
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labels
              });
            }
