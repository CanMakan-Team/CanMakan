# Test classpath application-dev.properties replaces the main one of the same name
# (classpath:/ resolves a single resource). Keep the main-dev JPA/SQL seed contract here
# and add test-only security overrides.
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
logging.level.org.hibernate.SQL=DEBUG

# Vite / emulator / LAN browser origins for local web testing (same as main application-dev).
canmakan.cors.allowed-origin-patterns=${CANMAKAN_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*],http://10.*.*.*:[*],http://192.168.*.*:[*],http://172.*.*.*:[*]}

app.security.jwt.signing-secret=dGVzdC1vbmx5LXNpZ25pbmcta2V5LTMyLWJ5dGVzISE=
app.security.refresh.cookie-secure=false
app.security.refresh.cookie-same-site=Lax
app.security.auth-rate-limit.enabled=false
