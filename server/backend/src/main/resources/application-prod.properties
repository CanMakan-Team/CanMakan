# Safe defaults for non-dev environments.
# Local runs and tests use spring.profiles.default=dev (see application.properties).
# Production MUST set SPRING_PROFILES_ACTIVE=prod (or equivalent).

spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
logging.level.org.hibernate.SQL=WARN

# Exact origins only — no LAN wildcards with credentials.
canmakan.cors.allowed-origin-patterns=${CANMAKAN_CORS_ALLOWED_ORIGIN_PATTERNS:}
