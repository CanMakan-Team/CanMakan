# Local development and automated tests (spring.profiles.default=dev).
# Enables SQL seed scripts, Hibernate SQL logging, and LAN CORS patterns.

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
logging.level.org.hibernate.SQL=DEBUG

# Vite / emulator / LAN browser origins for local web testing.
canmakan.cors.allowed-origin-patterns=${CANMAKAN_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*],http://10.*.*.*:[*],http://192.168.*.*:[*],http://172.*.*.*:[*]}
