spring.application.name=canmakan-backend
server.port=8080
management.endpoints.web.exposure.include=health

# Datasource
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/canmakan?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&allowMultiQueries=true}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Let SQL scripts own the schema (do not let Hibernate recreate tables)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Run scripts on every startup (dev only)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
logging.level.org.springframework.jdbc.datasource.init=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Schema first, then seed files in FK-safe order
spring.sql.init.continue-on-error=false
spring.sql.init.schema-locations=classpath:00_schema.sql
spring.sql.init.data-locations=classpath:01_products.sql,classpath:02_ingredients.sql,classpath:03_product_ingredients.sql,classpath:04_roles_users.sql,classpath:05_household_dietary_data.sql,classpath:06_scans_and_ai_logs.sql,classpath:07_subscriptions_usage.sql

