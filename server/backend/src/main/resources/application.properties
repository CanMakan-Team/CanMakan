spring.application.name=canmakan-backend
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=8080
management.endpoints.web.exposure.include=health
app.name=${APP_NAME:CanMakan}
app.version=${APP_VERSION:1.0}
app.contact.email=${APP_CONTACT_EMAIL:canmakan@example.invalid}

# Datasource
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:canmakan}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&allowMultiQueries=true
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Product integration
app.api.ean-search.token=${EAN_SEARCH_API_KEY:}
app.integration.open-food-facts.base-url=${OPEN_FOOD_FACTS_BASE_URL:https://world.openfoodfacts.org/api/v3/product}
app.integration.ean-search.base-url=${EAN_SEARCH_BASE_URL:https://api.ean-search.org}
app.integration.connect-timeout=${PRODUCT_CONNECT_TIMEOUT:3s}
app.integration.response-timeout=${PRODUCT_RESPONSE_TIMEOUT:8s}
app.integration.retry-count=${PRODUCT_RETRY_COUNT:2}
app.integration.retry-backoff=${PRODUCT_RETRY_BACKOFF:200ms}

# Let SQL scripts own the schema (do not let Hibernate recreate tables)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Run scripts on every startup (dev only)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
logging.level.org.springframework.jdbc.datasource.init=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Schema first, then seed files in FK-safe order
spring.sql.init.continue-on-error=false
spring.sql.init.schema-locations=classpath:00_schema.sql
spring.sql.init.data-locations=classpath:01_products.sql,classpath:02_ingredients.sql,classpath:03_product_ingredients.sql,classpath:04_roles_users.sql,classpath:05_household_dietary_data.sql,classpath:06_scans_and_ai_logs.sql,classpath:07_subscriptions_usage.sql

# Model provider and deterministic fallback boundary
spring.ai.model.chat=${AI_CHAT_PROVIDER:none}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.model=${OPENAI_MODEL:unconfigured}
spring.ai.openai.chat.temperature=${OPENAI_TEMPERATURE:0.2}
spring.ai.openai.chat.max-completion-tokens=${OPENAI_MAX_OUTPUT_TOKENS:1024}
spring.ai.openai.chat.timeout=${AI_RESPONSE_TIMEOUT:30s}
spring.ai.openai.chat.max-retries=0
spring.ai.retry.max-attempts=1
app.ai.response-timeout=${AI_RESPONSE_TIMEOUT:30s}
app.ai.retry-count=${AI_RETRY_COUNT:2}
app.ai.retry-backoff=${AI_RETRY_BACKOFF:500ms}
app.ai.audit.log-raw-prompt=${AI_LOG_RAW_PROMPT:false}
app.ai.audit.log-raw-response=${AI_LOG_RAW_RESPONSE:false}

# MCP remains disabled until the teammate-owned server endpoint is available.
spring.ai.mcp.client.enabled=${MCP_CLIENT_ENABLED:false}
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=${MCP_REQUEST_TIMEOUT:20s}
spring.ai.mcp.client.streamable-http.connections.dietary-knowledge.url=${MCP_SERVER_URL:http://localhost:8080}
spring.ai.mcp.client.streamable-http.connections.dietary-knowledge.endpoint=${MCP_SERVER_ENDPOINT:/mcp}
spring.ai.mcp.server.enabled=${MCP_SERVER_ENABLED:false}
spring.ai.mcp.server.protocol=STREAMABLE
