spring.application.name=canmakan-backend
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=8080
management.endpoints.web.exposure.include=health

# Default to local/dev behaviour when no profile is set (tests + `mvnw spring-boot:run`).
# Deployed environments MUST set SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev

# UC19 route path for the current-user profile endpoints (kept out of SecurityConfig as a
# customizable parameter rather than a hardcoded literal repeated across its 3 requestMatchers).
canmakan.security.profiles-me-path=${CANMAKAN_PROFILES_ME_PATH:/api/profiles/me}

# CORS — browser clients only (Android Retrofit usually sends no Origin).
# Override per environment with comma-separated lists (no code change for deploy):
#   CANMAKAN_CORS_ALLOWED_ORIGINS=https://app.example.com,https://www.example.com
#   CANMAKAN_CORS_ALLOWED_ORIGIN_PATTERNS=   (empty to disable LAN/local patterns in prod)
# Base defaults: exact Vite/preview/Firebase origins only. LAN patterns live in application-dev.properties.
# Note: if CANMAKAN_CORS_ALLOWED_ORIGINS is set in the environment it REPLACES the
# exact-origin default list.

# (UC55) The 'ngrok-skip-browser-warning' header is required when tunneling via Ngrok's free plan.
# Ngrok actively intercepts free-tier traffic with an HTML warning page to deter malicious hosting.
# Because this HTML page does not return valid CORS headers or JSON, browser-based fetch
# requests (like those from our Firebase frontend) will be blocked. This header instructs
# Ngrok to skip the warning and route traffic directly to the Spring Boot backend.
canmakan.cors.allowed-origins=${CANMAKAN_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,https://canmakan-project.web.app,https://canmakan-project.firebaseapp.com}
canmakan.cors.allowed-headers=${CANMAKAN_CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,ngrok-skip-browser-warning,X-CanMakan-Session-Request}
canmakan.cors.allowed-methods=${CANMAKAN_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
canmakan.cors.allowed-origin-patterns=${CANMAKAN_CORS_ALLOWED_ORIGIN_PATTERNS:}
canmakan.cors.allow-credentials=${CANMAKAN_CORS_ALLOW_CREDENTIALS:true}
canmakan.cors.max-age-seconds=${CANMAKAN_CORS_MAX_AGE_SECONDS:3600}

# UC9 invite share links (web origin + path /invite/{token}).
# Local default is Vite. Production: CANMAKAN_INVITES_PUBLIC_BASE_URL=https://canmakan-project.web.app
canmakan.invites.public-base-url=${CANMAKAN_INVITES_PUBLIC_BASE_URL:http://localhost:5173}
# Mobile invite email link (Firebase App Distribution install URL — same secret as web).
# HTTPS values are used as-is; custom schemes like canmakan://invite append /{token}.
canmakan.invites.mobile-base-url=${FIREBASE_APP_DISTRIBUTION_URL:https://appdistribution.firebase.google.com/}
canmakan.invites.expiry-days=${CANMAKAN_INVITES_EXPIRY_DAYS:7}

# UC10 Resend invitation email (disabled locally; set key + enabled=true in deploy)
canmakan.email.resend.enabled=${CANMAKAN_EMAIL_RESEND_ENABLED:true}
canmakan.email.resend.api-key=${CANMAKAN_EMAIL_RESEND_API_KEY:}
canmakan.email.resend.from=${CANMAKAN_EMAIL_RESEND_FROM:CanMakan <onboarding@canmakan.space>}
canmakan.email.resend.api-url=${CANMAKAN_EMAIL_RESEND_API_URL:https://api.resend.com/emails}

# Datasource (defaults are for local MySQL; override with env vars in CI/prod)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:canmakan}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&allowMultiQueries=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Application Metadata
app.name=CanMakan
app.version=1.0
app.contact.email=khairulanwar.kamaruzaman@u.nus.edu

# UC19 access JWT (signing secret must be Base64 for at least 32 bytes)
app.security.jwt.issuer=${JWT_ISSUER:canmakan}
app.security.jwt.access-ttl=${JWT_ACCESS_TTL:15m}
app.security.jwt.signing-secret=${JWT_SIGNING_SECRET:}

# UC19 opaque refresh session and cookie
app.security.refresh.ttl=${REFRESH_TOKEN_TTL:7d}
app.security.refresh.cookie-name=${REFRESH_COOKIE_NAME:canmakan_refresh}
app.security.refresh.cookie-secure=${REFRESH_COOKIE_SECURE:true}
# Lax is the safe default. Cross-site HTTPS deployments must explicitly choose None.
app.security.refresh.cookie-same-site=${REFRESH_COOKIE_SAME_SITE:Lax}

# Auth endpoint rate limit (login / register / refresh)
app.security.auth-rate-limit.enabled=${AUTH_RATE_LIMIT_ENABLED:true}
app.security.auth-rate-limit.max-attempts=${AUTH_RATE_LIMIT_MAX_ATTEMPTS:30}
app.security.auth-rate-limit.window=${AUTH_RATE_LIMIT_WINDOW:1m}

# Product API configuration contract (Open Food Facts & EAN-Search)
app.api.product.open-food-facts-base-url=${OPEN_FOOD_FACTS_BASE_URL:https://world.openfoodfacts.org/api/v3/product/}
app.api.product.ean-search-base-url=${EAN_SEARCH_BASE_URL:https://api.ean-search.org}
app.api.product.ean-search-token=${EAN_SEARCH_API_KEY:demo_token}
app.api.product.connect-timeout-ms=${PRODUCT_API_CONNECT_TIMEOUT_MS:3000}
app.api.product.response-timeout-ms=${PRODUCT_API_RESPONSE_TIMEOUT_MS:5000}
app.api.product.retry.max-attempts=${PRODUCT_API_RETRY_MAX_ATTEMPTS:2}
app.api.product.retry.backoff-ms=${PRODUCT_API_RETRY_BACKOFF_MS:250}

# Base JPA / SQL defaults are production-safe; application-dev.properties overrides for local seed.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8
logging.level.org.springframework.jdbc.datasource.init.ScriptUtils=INFO
logging.level.org.hibernate.SQL=WARN

# Schema first, then seed files in FK-safe order (loaded when spring.sql.init.mode=always on dev)
spring.sql.init.continue-on-error=false
spring.sql.init.schema-locations=classpath:00_schema.sql
spring.sql.init.data-locations=classpath:01_products.sql,classpath:01c_recommendation_substitute_tags.sql,classpath:01e_fish_sauce_product_updates.sql,classpath:01f_uc5_demo_gold_set.sql,classpath:08_popularity_tags.sql,classpath:02_ingredients.sql,classpath:03_product_ingredients.sql,classpath:04_roles_users.sql,classpath:05_household_dietary_data.sql,classpath:02b_ingredient_restrictions.sql,classpath:06_scans_and_ai_logs.sql,classpath:09_scans_feedback.sql,classpath:10_recommendation_logs.sql,classpath:07_subscriptions_usage.sql

# MCP Client
# Disabled for now; the local backend uses the repository-backed tool implementation directly.

# OpenAI (placeholder lets the app start locally; set a real key for AI features)
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
spring.ai.openai.api-key=${OPENAI_API_KEY:local-dev-placeholder}
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.temperature=0.2
spring.ai.openai.chat.max-tokens=1024
canmakan.ai.enabled=${CANMAKAN_AI_ENABLED:false}
canmakan.ai.timeout-ms=${CANMAKAN_AI_TIMEOUT_MS:10000}
canmakan.ai.retry.max-attempts=${CANMAKAN_AI_RETRY_MAX_ATTEMPTS:2}
canmakan.ai.retry.backoff-ms=${CANMAKAN_AI_RETRY_BACKOFF_MS:500}
# Soft limit for Tier-3 tool-calling agent loops (provider/timeout still bound overall runtime)
canmakan.ai.agent.max-tool-iterations=${CANMAKAN_AI_AGENT_MAX_TOOL_ITERATIONS:8}

# Web Client (placeholder lets the app start locally; set a real key for Tavily fallback)
app.api.tavily.key=${TAVILY_API_KEY:local-dev-placeholder}
app.api.tavily.url=${TAVILY_URL:https://api.tavily.com/search}

# AI audit configuration contract
canmakan.ai.audit.enabled=${CANMAKAN_AI_AUDIT_ENABLED:false}
canmakan.ai.audit.store-prompt=${CANMAKAN_AI_AUDIT_STORE_PROMPT:false}
canmakan.ai.audit.store-response=${CANMAKAN_AI_AUDIT_STORE_RESPONSE:false}

# UC5 Tier C ML recommendation (content-based discovery and re-rank)
canmakan.recommendation.ml.enabled=${CANMAKAN_RECOMMENDATION_ML_ENABLED:true}
canmakan.recommendation.ml.artifact-path=${CANMAKAN_RECOMMENDATION_ML_ARTIFACT_PATH:}
canmakan.recommendation.ml.ranker-url=${CANMAKAN_RECOMMENDATION_ML_RANKER_URL:}
canmakan.recommendation.ml.ranker-connect-timeout-ms=${CANMAKAN_RECOMMENDATION_ML_RANKER_CONNECT_TIMEOUT_MS:500}
canmakan.recommendation.ml.ranker-read-timeout-ms=${CANMAKAN_RECOMMENDATION_ML_RANKER_READ_TIMEOUT_MS:2000}

# Unused on the MVP request path (RecommendationService does not call Tier B).
canmakan.recommendation.llm.enabled=${CANMAKAN_RECOMMENDATION_LLM_ENABLED:false}

# ETL: Open Food Facts SQL generator (manual/local run only, via the 'generate-sql' profile).
# Points to a local gzipped Open Food Facts CSV export and where to write the resulting products.sql.
# Left unset by default; OpenFoodFactsSqlGenerator logs an error and exits early if either is blank.
canmakan.etl.open-food-facts.input-gz-path=${OFF_INPUT_GZ_PATH:}
canmakan.etl.open-food-facts.output-sql-path=${OFF_OUTPUT_SQL_PATH:}
