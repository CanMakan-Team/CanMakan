# =============================================================================
# Demo profile — populated admin dashboards for presentations.
#
# Demo data (users/scans/sessions/audit/AI logs) is DELIBERATELY not part of the
# base seed: it seeds login-capable accounts with a shared password and fabricated
# statistics, which must never run in prod/CI by default. It only loads when the
# "demo" profile is active.
#
# Local demo:
#   .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=demo"
# Deployed (only if you want the live/EC2 site populated):
#   set SPRING_PROFILES_ACTIVE=demo in the deploy environment.
#
# This re-declares spring.sql.init.data-locations = base seed + demo files (11/12/13).
# =============================================================================

spring.sql.init.data-locations=classpath:01_products.sql,classpath:01c_recommendation_substitute_tags.sql,classpath:01e_fish_sauce_product_updates.sql,classpath:01f_uc5_demo_gold_set.sql,classpath:08_popularity_tags.sql,classpath:02_ingredients.sql,classpath:03_product_ingredients.sql,classpath:04_roles_users.sql,classpath:05_household_dietary_data.sql,classpath:02b_ingredient_restrictions.sql,classpath:06_scans_and_ai_logs.sql,classpath:09_scans_feedback.sql,classpath:10_recommendation_logs.sql,classpath:07_subscriptions_usage.sql,classpath:11_demo_dashboard_data.sql,classpath:12_demo_retention_data.sql,classpath:13_demo_signups_data.sql
