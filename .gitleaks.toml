# Extends default Gitleaks rules. Do not disable useDefault.
# Syntax is Gitleaks 8.21.x ([allowlist], not [[allowlists]]).
title = "canmakan"

[extend]
useDefault = true

[allowlist]
description = "Test JWT placeholder; Firebase google-services.json client API key (restricted in GCP, expected in Android builds)"
regexTarget = "secret"
regexes = [
  '''dGVzdC1vbmx5LXNpZ25pbmcta2V5LTMyLWJ5dGVzISE=''',
]
paths = [
  '''google-services\.json$''',
]
